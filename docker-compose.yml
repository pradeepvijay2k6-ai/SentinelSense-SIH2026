version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelsense_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./sample_data:/app/sample_data
      - ./ml:/app/ml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelsense_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
